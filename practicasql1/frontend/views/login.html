<div class="card">
  <h2>Iniciar Sesión</h2>
  <form id="form-login">
    <div class="form-group">
      <label>Correo Electrónico:</label>
      <input type="email" id="login-email" required placeholder="ejemplo@web.com">
    </div>
    <div class="form-group">
      <label>Contraseña:</label>
      <input type="password" id="login-password" required>
    </div>
    <button type="submit" class="btn-gplus">Ingresar</button>
  </form>
  <p id="login-msg" style="margin-top: 15px;"></p>
</div>
